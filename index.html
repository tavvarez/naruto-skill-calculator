<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Skills - Naruto</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style/main.css">
</head>
<body class="bg-dark text-white">

  <div class="container mt-5">
    <h1 class="mb-4 text-center">Calculador4a de SKILLs - NTOBrasil 🍥</h1>

    <!-- Treinos -->
    <div class="mb-3">
      <label for="trainingType" class="form-label">Skill a treinar:</label>
      <select class="form-select" id="trainingType">
        <option value="gloves">Gloves</option>
        <option value="speed">Speed</option>
        <option value="sword">Sword</option>
        <option value="distance">Distance</option>
      </select>
    </div>

    <!-- Skill Atual -->
    <div class="mb-3">
      <label for="currentSkill" class="form-label">Skill Atual:</label>
      <input type="number" class="form-control" id="currentSkill" min="10" max="200" />
    </div>

    <!-- Porcentagem da skill atual -->
    <div class="mb-3">
      <label for="currentPercent" class="form-label">% da Skill Atual:</label>
      <input type="range" class="form-range" min="0" max="100" id="currentPercent" value="0">
      <div><span id="percentValue">0%</span></div>
    </div>

    <!-- Skill Desejada -->
    <div class="mb-3">
      <label for="targetSkill" class="form-label">Skill Desejada:</label>
      <input type="number" class="form-control" id="targetSkill" min="11" max="200" />
    </div>

    <!-- Boosts -->
    <div class="mb-3">
      <label class="form-label">Modificadores:</label><br>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" id="isVip">
        <label class="form-check-label" for="vipStatus">VIP</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" id="isBooster">
        <label class="form-check-label" for="boosterStatus">Booster de Trainer</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" id="isDoubleSkill">
        <label class="form-check-label" for="doubleSkillStatus">Double Skill</label>
      </div>
    </div>

    <!-- Botão -->
    <div class="mb-4">
      <button class="btn btn-primary w-100" onclick="calcularSkill()">Calcular Skill</button>
    </div>

    <!-- Resultado -->
    <div id="resultado" class="alert alert-info text-dark d-none"></div>
  </div>

  <script src="scripts/config.js"></script>
  <script src="scripts/logic.js"></script>
  <script src="scripts/main.js"></script>
</body>
</html>
